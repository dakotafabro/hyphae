[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-hyphae"
version = "0.1.1"
description = "Session continuity for AI agents across machines - translocation through shared substrate"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.13.0",
    "pyyaml>=6.0",
]

[project.scripts]
mcp_hyphae = "mcp_hyphae.server:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_hyphae"]
